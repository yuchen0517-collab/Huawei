<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>非正式沟通 · 卡牌</title>
<link rel="stylesheet" href="../assets/fonts.css">
<script>
/* 先按窗口算好缩放，避免首帧溢出 */
(function(){
  function fit(){
    var pad = 16, bleed = 16;   /* 页面留白 + 背板/投影余量 */
    var vw = window.innerWidth || document.documentElement.clientWidth;
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var s = Math.min(1, (vw - pad*2 - bleed*2) / 755, (vh - pad*2 - bleed*2) / 1083);
    s = Math.max(s, 0.2);
    document.documentElement.style.setProperty('--s', s.toFixed(4));
    document.documentElement.setAttribute('data-scale', s.toFixed(3));
  }
  window.__fitCardViewport = fit;
  fit();
})();
</script>
<style>
  /* ============================================================
     非正式沟通 · 事件卡
     版式按设计稿 1:1 复刻：卡面 755 × 1083 px，45° 切角 24px
     整张卡按窗口等比缩放（--s），任何浏览器窗口都不会被裁掉。
     文案全部来自下方 #card-data，可整块替换；也可用 URL 参数覆盖。
     ============================================================ */
  /* 项目字体子集缺少 U+6346「捆」与 U+6E20「渠」的字形，
     这两字会退回系统字体；显式声明本地字体以避免度量错位。 */
  @font-face{
    font-family:'CJKFallback';
    src:local('SimSun'), local('NSimSun'), local('Songti SC'), local('Noto Serif CJK SC');
    unicode-range:U+6346, U+6E20;
  }

  :root{
    --card-w: 755px;
    --card-h: 1083px;
    --s: 1;                   /* 由脚本按窗口计算 */
    --oct: polygon(24px 0, 731px 0, 755px 24px, 755px 1059px, 731px 1083px, 24px 1083px, 0 1059px, 0 24px);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  [hidden]{ display:none !important; }

  html,body{ min-height:100%; }

  body{
    font-family:"Noto Serif SC","CJKFallback","Source Han Serif SC","Songti SC","SimSun",serif;
    color:#e8e2e9;
    background:
      radial-gradient(120% 90% at 50% -10%, #1c1524 0%, #100d15 45%, #07060a 100%);
    display:grid;
    place-items:center;
    min-height:100vh;
    min-height:100dvh;
    padding:16px;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* 缩放容器：版面尺寸随 --s 收缩，grid 居中不会溢出 */
  .stage{
    position:relative;
    width:calc(var(--card-w) * var(--s));
    height:calc(var(--card-h) * var(--s));
  }

  .shell{
    position:absolute; left:0; top:0;
    width:var(--card-w); height:var(--card-h);
    transform:scale(var(--s));
    transform-origin:0 0;
    filter:drop-shadow(0 34px 60px rgba(0,0,0,.66)) drop-shadow(0 0 46px rgba(96,64,150,.22));
  }

  /* 卡面后方的叠层，露出右下的一线边缘 */
  .back{
    position:absolute; inset:0;
    transform:translate(15px,17px);
    clip-path:var(--oct);
    background:#4c3a64;
    opacity:.55;
  }
  .back::after{
    content:""; position:absolute; inset:1px;
    clip-path:var(--oct);
    background:linear-gradient(165deg,#241b33,#150f20 60%,#1c1428);
  }

  /* ---------------- 卡面 ---------------- */
  .card{
    position:absolute; inset:0;
    clip-path:var(--oct);
    background:#6f6288;              /* 描边色：由内层遮出 1.5px 边线 */
  }
  .card::before{
    content:""; position:absolute; inset:1.5px;
    clip-path:var(--oct);
    background:
      radial-gradient(120% 12% at 50% -2%, rgba(138,108,172,.22), rgba(138,108,172,0) 70%),
      radial-gradient(120% 10% at 50% 104%, rgba(126,94,166,.10), rgba(126,94,166,0) 72%),
      linear-gradient(180deg,
        #271f2f 0%,  #221c2a 6%,  #201a27 13%,
        #1e1824 24%, #1c1720 38%, #1b1620 54%,
        #1a151e 72%, #1b161f 86%, #1e1725 94%, #211a29 100%);
  }
  /* 卡面颗粒质感 */
  .card::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity:.16;
    mix-blend-mode:overlay;
  }

  /* 双线描边：外粗内细，跟随切角 */
  .frame{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none;
  }
  .frame .edge{
    fill:none; stroke:rgba(196,178,226,.40); stroke-width:1.5;
    filter:drop-shadow(0 0 6px rgba(152,122,210,.30));
  }
  .frame .hair{
    fill:none; stroke:rgba(198,178,232,.20); stroke-width:1;
  }

  /* ---------------- 页眉 ---------------- */
  .hdr{ position:absolute; left:0; top:0; right:0; height:150px; }

  .lock{
    position:absolute; left:52px; top:43px;
    width:26px; height:33px;
  }
  .lock svg{ display:block; width:100%; height:100%; overflow:visible; }
  .lock svg *{
    fill:none; stroke:#dccbf2; stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 0 5px rgba(190,150,255,.55));
  }

  .hdr-main{ position:absolute; left:109px; top:34px; }
  .eyebrow{
    display:block;
    font-size:13px; letter-spacing:4.6px; line-height:1;
    color:#a89cb8;
    text-transform:uppercase;
  }
  .subtitle{
    display:block;
    margin-top:11px;
    font-size:25.5px; letter-spacing:-.5px; line-height:1;
    font-weight:400;
    color:#e4d1bb;
    text-shadow:0 0 14px rgba(226,196,158,.18);
  }

  .hdr-right{
    position:absolute; right:30px; top:28px;
    display:flex; flex-direction:column; align-items:flex-end; gap:4px;
  }
  .x-btn{
    position:relative;
    width:17px; height:17px; padding:0; border:0; background:none; cursor:pointer;
    display:grid; place-items:center;
    color:inherit; text-decoration:none;
    border-radius:2px;
    transition:transform .18s;
  }
  /* 视觉上仍是 17px，可点区域扩大到约 37px（底部不压住序列号） */
  .x-btn::after{ content:""; position:absolute; inset:-10px -10px -3px; }
  .x-btn svg{ width:17px; height:17px; overflow:visible; }
  .x-btn path{
    fill:none; stroke:#d3c9d6; stroke-width:1.3; stroke-linecap:round;
    transition:stroke .2s;
  }
  .x-btn:hover path{ stroke:#f0e6f4; }
  .x-btn:hover{ transform:scale(1.12); }
  .x-btn:active{ transform:scale(.94); }
  .serial{
    font-size:15px; letter-spacing:2.4px; line-height:1;
    color:#cdbaa7;
  }

  /* ---------------- 插图 ---------------- */
  .art{
    position:absolute; left:29px; top:109px;
    width:696px; height:317px;
    border:1px solid rgba(222,204,178,.55);
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(120,96,160,.20),
      0 0 30px rgba(140,100,210,.16);
  }
  .art img{
    display:block; width:100%; height:100%; object-fit:cover;
    filter:brightness(.97) contrast(1.0) saturate(1.02);
  }
  .art::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 46px rgba(8,6,16,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ---------------- 正文 ---------------- */
  .round{
    position:absolute; left:38px; top:461px; width:717px;
    display:flex; align-items:center; gap:12px;
  }
  .round .txt{
    font-size:15px; letter-spacing:2.2px; line-height:1;
    color:#c8b49b;
    white-space:nowrap;
  }
  .round .rule{
    flex:1; height:1px;
    background:linear-gradient(90deg,
      rgba(232,208,170,.52) 0%, rgba(232,208,170,.30) 34%, rgba(232,208,170,0) 92%);
  }

  /* 文案区：固定顶端与可用高度，字号按内容自动微缩（--f），
     保证「代表团名称」再长也不会压到下方的渠道说明。
     228px 留出与「渠道说明」之间的呼吸位（默认文案只用到 205px）。 */
  .copy{
    position:absolute; left:39px; top:499px; width:700px;
    max-height:228px;
    overflow:hidden;
    --f:1;
  }

  .title{
    font-size:calc(46px * var(--f));
    font-weight:600; letter-spacing:0;
    line-height:calc(47.84px * var(--f));
    background:linear-gradient(178deg,#fdf3e2 4%,#f3dcb7 46%,#e6c795 92%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 16px rgba(255,228,182,.16));
    text-wrap:balance;
  }

  .lede{
    margin-top:calc(23.16px * var(--f));
    width:656px; max-width:100%;
    font-size:calc(23px * var(--f));
    line-height:calc(40px * var(--f));
    letter-spacing:0;
    color:#b2a6b3;
    text-wrap:pretty;
  }

  .caveat{
    position:relative;
    margin-top:calc(18px * var(--f));
    margin-left:-3px;
    width:680px; max-width:calc(100% + 3px);
    padding-left:21px;
    font-size:calc(18.4px * var(--f));
    line-height:calc(36px * var(--f));
    letter-spacing:.2px;
    color:#c8a980;
  }
  .caveat::before{
    content:""; position:absolute; left:0; top:0;
    width:3px; height:calc(36px * var(--f));
    background:linear-gradient(180deg,#e0c08d,#b18f5c);
    box-shadow:0 0 12px rgba(220,186,126,.55);
  }

  .ch-head{
    position:absolute; left:38px; top:755px; width:680px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .ch-head .lab{
    font-size:17.5px; letter-spacing:1px; line-height:1;
    color:#c4ae96;
  }
  .ch-head .ser{
    font-size:12px; letter-spacing:2.4px; line-height:1;
    color:#a69c99;
    position:relative; top:-3px;
  }

  .ch-row{
    position:absolute; left:37px; width:680px;
    display:flex; align-items:center; gap:19px;
    padding:0 20px;
    border:1px solid rgba(186,172,202,.34);
    border-left-color:rgba(214,192,248,.62);
    background:
      linear-gradient(90deg,
        rgba(196,170,236,.30) 0%, rgba(150,124,196,.12) 9%,
        rgba(255,255,255,.030) 26%, rgba(255,255,255,.026) 62%,
        rgba(190,160,230,.11) 88%, rgba(206,178,246,.20) 100%);
    box-shadow:
      inset 2px 0 6px -3px rgba(206,180,246,.50),
      inset -2px 0 6px -3px rgba(206,180,246,.28),
      inset 0 1px 0 rgba(255,255,255,.07);
  }
  .ch-row.r1{ top:793px; height:62px; }
  .ch-row.r2{ top:861px; height:64px; }
  .ch-row b{
    font-weight:400;
    font-size:16.5px; letter-spacing:1.2px; line-height:1;
    color:#ceb795;
    white-space:nowrap;
  }
  .ch-row span{
    font-size:17px; letter-spacing:0; line-height:1.25;
    color:#d3c9d2;
  }

  /* ---------------- 按钮 / 链接 ---------------- */
  .actions{ position:absolute; left:37px; top:980px; width:680px; height:72px; }

  .ghost{
    position:absolute; left:0; top:0;
    width:138px; height:72px;
    display:flex; align-items:center; justify-content:center;
    font-family:inherit;
    font-size:23px; letter-spacing:0;
    color:#ddc9b5;
    text-decoration:none;
    background:rgba(255,255,255,.012);
    border:1px solid rgba(228,200,158,.55);
    cursor:pointer;
    transition:background .22s, color .22s, border-color .22s;
  }
  .ghost:hover{ background:rgba(228,200,158,.10); border-color:rgba(240,216,178,.8); color:#f4e6d4; }
  .ghost:active{ background:rgba(228,200,158,.16); }

  .primary{
    position:absolute; left:430px; top:0;
    width:251px; height:72px;
    display:block;
    padding:0;
    font-family:inherit;
    font-size:25px; letter-spacing:0;
    color:#faeacf;
    text-decoration:none;
    background:#e6cd9f;                      /* 仅作描边，由内层遮出 1.6px */
    border:0; cursor:pointer;
    clip-path:polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    filter:drop-shadow(0 0 16px rgba(232,206,160,.20));
    transition:filter .22s;
  }
  .primary::before{
    content:""; position:absolute; inset:1.6px;
    clip-path:polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
    background:
      radial-gradient(110% 150% at 92% -14%, rgba(206,176,132,.13), rgba(206,176,132,0) 58%),
      linear-gradient(180deg, #2b2432 0%, #2e2636 42%, #372d46 72%, #463a58 100%);
  }
  .primary .inner{
    position:relative;
    display:flex; align-items:center; justify-content:center; gap:30px;
    height:100%;
  }
  .primary:hover{ filter:drop-shadow(0 0 22px rgba(240,214,170,.38)); }
  .primary:hover::before{ filter:brightness(1.1); }
  .primary:active{ filter:drop-shadow(0 0 14px rgba(240,214,170,.30)); }
  .primary .arrow{ width:24px; height:13px; overflow:visible; }
  .primary .arrow path{
    fill:none; stroke:#f7e4c4; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;
  }

  :focus-visible{ outline:2px solid rgba(240,214,170,.92); outline-offset:4px; }

  /* ---------------- 替换演示面板（?demo=1 才出现） ---------------- */
  .demo{
    position:fixed; left:16px; bottom:16px; z-index:30;
    width:288px;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    padding:13px 15px 12px;
    background:rgba(17,13,23,.93);
    border:1px solid rgba(196,178,226,.30);
    box-shadow:0 18px 44px rgba(0,0,0,.6);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    font-size:13px; color:#cfc4d6;
  }
  .demo-head{
    display:flex; align-items:baseline; justify-content:space-between;
    padding-bottom:9px; margin-bottom:2px;
    border-bottom:1px solid rgba(196,178,226,.18);
  }
  .demo-head b{ font-size:14px; font-weight:400; letter-spacing:2px; color:#e4d1bb; }
  .demo-head span{ font-size:9px; letter-spacing:2.4px; color:#9a8ea8; }
  .demo-row{
    display:grid; grid-template-columns:48px 1fr; gap:8px; align-items:start;
    margin-top:8px;
  }
  .demo-row > span{
    padding-top:7px;
    font-size:12px; letter-spacing:1px; color:#a89cb8;
  }
  .demo input,.demo textarea,.demo select{
    width:100%;
    font:inherit; font-size:12.5px; line-height:1.5;
    color:#efe7f4;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(196,178,226,.26);
    padding:5px 7px;
    outline:none;
    transition:border-color .2s, background .2s;
  }
  .demo textarea{ resize:vertical; min-height:58px; }
  .demo input:focus,.demo textarea:focus,.demo select:focus{ border-color:rgba(228,200,158,.7); background:rgba(255,255,255,.07); }
  .demo input:focus-visible,.demo textarea:focus-visible,.demo select:focus-visible{ outline:none; }
  .demo-tip{
    margin-top:6px;
    font-size:10.5px; line-height:1.7; color:#8f849d;
  }
  .demo-stat{
    margin-top:10px; padding-top:9px;
    border-top:1px solid rgba(196,178,226,.18);
    font-size:10.5px; letter-spacing:.6px; color:#c9ab84;
  }

  .toast{
    position:fixed; left:50%; bottom:26px; z-index:40;
    max-width:min(560px,calc(100vw - 32px));
    padding:10px 18px;
    transform:translate(-50%,14px);
    background:rgba(20,15,27,.95);
    border:1px solid rgba(228,200,158,.45);
    box-shadow:0 14px 36px rgba(0,0,0,.55);
    font-size:13px; letter-spacing:.5px; color:#e9dcc9;
    opacity:0; pointer-events:none;
    transition:opacity .22s, transform .22s;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (max-width: 560px){
    .demo{ left:12px; right:12px; bottom:12px; width:auto; }
    .demo-row{ grid-template-columns:44px 1fr; }
  }
</style>
<style>/* 透明背景 */</style>
  <style>
    html, body { background: transparent !important; }
    .back { display: none !important; }
    .shell { background: transparent !important; }
  </style>
</head>
<body>

<div class="stage">
  <div class="shell">
    <div class="back"></div>

    <div class="card">
      <!-- 双线描边 -->
      <svg class="frame" viewBox="0 0 755 1083" preserveAspectRatio="none" aria-hidden="true">
        <polygon class="edge" points="24,1.6 731,1.6 753.4,24 753.4,1059 731,1081.4 24,1081.4 1.6,1059 1.6,24"/>
        <polygon class="hair" points="36,13 719,13 742,36 742,1047 719,1070 36,1070 13,1047 13,36"/>
      </svg>

      <!-- 页眉 -->
      <header class="hdr">
        <div class="lock" aria-hidden="true">
          <svg viewBox="0 0 26 33">
            <rect x="2" y="13" width="22" height="18" rx="3"/>
            <path d="M6.4 13V9.2a6.6 6.6 0 0 1 13.2 0V13"/>
            <path d="M13 20.4v4.2"/>
          </svg>
        </div>

        <div class="hdr-main">
          <span class="eyebrow">INFORMAL CONTACT</span>
          <span class="subtitle">非正式沟通</span>
        </div>

        <div class="hdr-right">
          <!-- 右上角 ×：可指向任意页面（配置项 actions.close.href） -->
          <a class="x-btn" id="actClose" href="index.html?mode=multilateral" aria-label="关闭">
            <svg viewBox="0 0 15 15"><path d="M1 1l13 13M14 1L1 14"/></svg>
          </a>
          <span class="serial" id="serial">INFORMAL · 01</span>
        </div>
      </header>

      <!-- 插图 -->
      <figure class="art">
        <img id="artImg" src="art-informal-whisper.jpg" alt="两名无五官的人体模特在紫色数据面板前低声交谈">
      </figure>

      <!-- 正文 -->
      <div class="round">
        <span class="txt" id="roundText">ROUND 06 · 沟通邀请</span>
        <i class="rule"></i>
      </div>

      <section class="copy" id="copy">
        <h1 class="title" id="cardTitle">印度代表团请求非正式沟通</h1>
        <p class="lede" id="cardLede">印度希望就公共算力配额与能力建设基金，私下交换非约束性意向。</p>
        <p class="caveat" id="cardCaveat">这份邀请不产生秘密约束。任何承诺仍须通过正式卡牌与公开文本确认。</p>
      </section>

      <div class="ch-head">
        <span class="lab">渠道说明</span>
        <span class="ser">CHANNEL</span>
      </div>

      <div class="ch-row r1" id="chRow1">
        <b id="ch1Label">受限保密</b>
        <span id="ch1Text">可私下探底 · 须向授权团队备案</span>
      </div>
      <div class="ch-row r2" id="chRow2">
        <b id="ch2Label">公开替代</b>
        <span id="ch2Text">拒绝沟通仍可通过正式议题捆绑达成协议</span>
      </div>

      <div class="actions">
        <!-- 暂不回应：可指向任意页面（配置项 actions.decline.href） -->
        <a class="ghost" id="actDecline" href="index.html?mode=multilateral&amp;invite=decline">暂不回应</a>
        <!-- 进入沟通：可指向任意页面（配置项 actions.accept.href） -->
        <a class="primary" id="actAccept" href="index.html?mode=multilateral&amp;invite=accept">
          <span class="inner">
            <span id="acceptLabel">进入沟通</span>
            <svg class="arrow" viewBox="0 0 26 16" aria-hidden="true"><path d="M1 8h22M16 1.5l7 6.5-7 6.5"/></svg>
          </span>
        </a>
      </div>
    </div>
  </div>
</div>

<!-- 替换演示面板：仅 URL 加 ?demo=1 时显示 -->
<aside class="demo" id="demoPanel" hidden>
  <div class="demo-head"><b>替换演示</b><span>DEMO</span></div>
  <label class="demo-row">
    <span>代表团</span>
    <input id="demoDelegation" type="text" autocomplete="off" spellcheck="false">
  </label>
  <label class="demo-row">
    <span>简称</span>
    <input id="demoShort" type="text" autocomplete="off" spellcheck="false">
  </label>
  <label class="demo-row">
    <span>诉求句</span>
    <textarea id="demoAsk" rows="3" spellcheck="false"></textarea>
  </label>
  <label class="demo-row">
    <span>预设</span>
    <select id="demoPreset">
      <option value="">— 选择示例 —</option>
    </select>
  </label>
  <p class="demo-stat" id="demoStat"></p>
  <p class="demo-tip">演示模式：改动实时生效；诉求句里写 {short} 可自动代入简称；点击卡面按钮只提示目标链接，不会真正跳转。</p>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============================================================
     卡面数据：改这里就能换主体。
     可用占位符：{delegation} {short} {en} {round} {roundLabel} {serial}
     链接默认用相对路径；留空字符串 ("") 则点击不跳转。
     需要新窗口打开时，在对应 actions 项里加 "target": "_blank"。
     临时预览也可以用 URL 参数覆盖，例如：
       ?delegation=巴西代表团&short=巴西&ask=…&accept=negotiation.html
     ============================================================ -->
<script type="application/json" id="card-data">
{
  "delegation": "印度代表团",
  "short": "印度",
  "en": "DELEGATION OF INDIA",
  "round": "06",
  "roundLabel": "沟通邀请",
  "serial": "INFORMAL · 01",
  "title": "{delegation}请求非正式沟通",
  "ask": "{short}希望就公共算力配额与能力建设基金，私下交换非约束性意向。",
  "caveat": "这份邀请不产生秘密约束。任何承诺仍须通过正式卡牌与公开文本确认。",
  "channels": [
    { "label": "受限保密", "text": "可私下探底 · 须向授权团队备案" },
    { "label": "公开替代", "text": "拒绝沟通仍可通过正式议题捆绑达成协议" }
  ],
  "art": {
    "src": "art-informal-whisper.jpg",
    "alt": "两名无五官的人体模特在紫色数据面板前低声交谈"
  },
  "actions": {
    "close":   { "href": "index.html?mode=multilateral", "label": "关闭" },
    "decline": { "href": "index.html?mode=multilateral&invite=decline", "label": "暂不回应" },
    "accept":  { "href": "index.html?mode=multilateral&invite=accept", "label": "进入沟通" }
  }
}
</script>

<script>
(function(){
  'use strict';

  var dataEl = document.getElementById('card-data');
  var DEFAULT = JSON.parse(dataEl.textContent);
  var params = new URLSearchParams(location.search);
  var cfg = clone(DEFAULT);
  var demoOn = params.get('demo') === '1';
  var PRESETS = [
    { delegation:'印度代表团', short:'印度',
      ask:'印度希望就公共算力配额与能力建设基金，私下交换非约束性意向。' },
    { delegation:'巴西代表团', short:'巴西',
      ask:'巴西希望就热带雨林碳汇定价与绿色基金份额，私下交换非约束性意向。' },
    { delegation:'欧盟委员会贸易与经济安全代表团', short:'欧盟委员会',
      ask:'欧盟委员会希望就跨境数据流动与算法审计标准，私下交换非约束性意向。' },
    { delegation:'美利坚合众国代表团', short:'美国',
      ask:'美国希望就芯片出口管制的豁免清单与核验程序，私下交换非约束性意向。' },
    { delegation:'东盟秘书处代表团', short:'东盟',
      ask:'东盟希望就区域算力共享与灾害预警数据，私下交换非约束性意向。' }
  ];

  /* ---------- 工具 ---------- */
  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

  function merge(target, patch){
    Object.keys(patch || {}).forEach(function(key){
      var value = patch[key];
      if(value && typeof value === 'object' && !Array.isArray(value) && target[key] && typeof target[key] === 'object'){
        merge(target[key], value);
      } else {
        target[key] = value;
      }
    });
    return target;
  }

  function context(){
    return {
      delegation: cfg.delegation,
      short: cfg.short,
      en: cfg.en,
      round: cfg.round,
      roundLabel: cfg.roundLabel,
      serial: cfg.serial
    };
  }

  /* 只做纯文本替换，不拼 HTML，避免 URL 参数注入 */
  function fill(value){
    var ctx = context();
    return String(value == null ? '' : value).replace(/\{(\w+)\}/g, function(match, key){
      return Object.prototype.hasOwnProperty.call(ctx, key) ? String(ctx[key]) : match;
    });
  }

  /* ---------- URL 参数覆盖 ---------- */
  var QUERY_KEYS = ['delegation','short','en','round','roundLabel','serial','title','ask','caveat'];
  QUERY_KEYS.forEach(function(key){
    if(params.has(key)){
      var value = params.get(key);
      if(value !== '') cfg[key] = value;
    }
  });
  ['close','decline','accept'].forEach(function(key){
    if(params.has(key) && cfg.actions[key]) cfg.actions[key].href = params.get(key);
  });

  /* ---------- 渲染 ---------- */
  var el = {
    serial: document.getElementById('serial'),
    round: document.getElementById('roundText'),
    title: document.getElementById('cardTitle'),
    lede: document.getElementById('cardLede'),
    caveat: document.getElementById('cardCaveat'),
    art: document.getElementById('artImg'),
    chRows: [document.getElementById('chRow1'), document.getElementById('chRow2')],
    chLabels: [document.getElementById('ch1Label'), document.getElementById('ch2Label')],
    chTexts: [document.getElementById('ch1Text'), document.getElementById('ch2Text')],
    copy: document.getElementById('copy'),
    close: document.getElementById('actClose'),
    decline: document.getElementById('actDecline'),
    accept: document.getElementById('actAccept'),
    acceptLabel: document.getElementById('acceptLabel')
  };

  /* 空链接时不跳转：共用同一个拦截函数，反复渲染也不会重复绑定 */
  function blockNav(e){ e.preventDefault(); }

  function applyLink(node, action, forceLabel){
    var href = action && typeof action.href === 'string' ? action.href.trim() : '';
    if(href){
      node.setAttribute('href', href);
      if(node.dataset.noop){
        delete node.dataset.noop;
        node.removeEventListener('click', blockNav);
      }
    } else {
      node.setAttribute('href', '#');
      if(!node.dataset.noop){
        node.dataset.noop = '1';
        node.addEventListener('click', blockNav);
      }
    }
    if(action && action.target){
      node.setAttribute('target', action.target);
      if(action.target === '_blank') node.setAttribute('rel','noopener noreferrer');
    } else {
      node.removeAttribute('target');
      node.removeAttribute('rel');
    }
    var label = fill((action && action.label) || forceLabel || '');
    if(label){
      node.setAttribute('aria-label', label);
      return label;
    }
    return '';
  }

  function render(){
    el.serial.textContent = fill(cfg.serial);
    el.round.textContent = 'ROUND ' + fill(cfg.round) + ' · ' + fill(cfg.roundLabel);
    el.title.textContent = fill(cfg.title);
    el.lede.textContent = fill(cfg.ask);
    el.caveat.textContent = fill(cfg.caveat);

    if(cfg.art && cfg.art.src) el.art.src = fill(cfg.art.src);
    el.art.alt = fill((cfg.art && cfg.art.alt) || '');

    el.chRows.forEach(function(row, index){
      var channel = cfg.channels && cfg.channels[index];
      if(channel && (channel.label || channel.text)){
        row.hidden = false;
        el.chLabels[index].textContent = fill(channel.label || '');
        el.chTexts[index].textContent = fill(channel.text || '');
      } else {
        row.hidden = true;
      }
    });

    applyLink(el.close, cfg.actions.close, '关闭');
    var declineLabel = applyLink(el.decline, cfg.actions.decline, '暂不回应');
    if(declineLabel) el.decline.textContent = declineLabel;

    var acceptLabel = applyLink(el.accept, cfg.actions.accept, '进入沟通');
    if(acceptLabel) el.acceptLabel.textContent = acceptLabel;

    fitCopy();
  }

  /* 文案变长（例如代表团名称很长、诉求句很长）时，
     按 2% 一档缩小字号与行距，直到整段落在文案区内。 */
  function fitCopy(){
    var box = el.copy;
    var min = 0.7, f = 1, guard = 0;
    box.style.setProperty('--f', '1');
    while(box.scrollHeight > box.clientHeight + 0.5 && f > min && guard < 40){
      f = Math.max(min, f - 0.02);
      box.style.setProperty('--f', f.toFixed(3));
      guard++;
    }
    document.documentElement.setAttribute('data-copy-fit', f.toFixed(2));
    updateStat();
  }

  /* 演示面板里的状态行（默认视图不可见） */
  var statEl = null;
  function updateStat(){
    if(!statEl) statEl = document.getElementById('demoStat');
    if(!statEl) return;
    statEl.textContent = '版面缩放 ' + (document.documentElement.getAttribute('data-scale') || '1')
      + ' · 文案缩放 ' + (document.documentElement.getAttribute('data-copy-fit') || '1');
  }

  /* ---------- 窗口缩放 ---------- */
  function fitViewport(){
    if(window.__fitCardViewport) window.__fitCardViewport();
    updateStat();
  }
  fitViewport();
  window.addEventListener('resize', fitViewport);
  window.addEventListener('orientationchange', fitViewport);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', fitViewport);
  /* 有些内嵌浏览器不会派发 resize，尺寸变化时补算一次 */
  if(window.ResizeObserver){
    new ResizeObserver(fitViewport).observe(document.documentElement);
  }
  setTimeout(fitViewport, 150);
  setTimeout(fitViewport, 700);

  render();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitCopy(); updateStat(); });
  window.addEventListener('load', function(){ fitCopy(); fitViewport(); });

  /* ---------- 演示面板 ---------- */
  var toastEl = document.getElementById('toast'), toastTimer;
  function toast(text){
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
  }

  if(demoOn){
    var panel = document.getElementById('demoPanel');
    var inputDelegation = document.getElementById('demoDelegation');
    var inputShort = document.getElementById('demoShort');
    var inputAsk = document.getElementById('demoAsk');
    var selectPreset = document.getElementById('demoPreset');

    PRESETS.forEach(function(preset, index){
      var option = document.createElement('option');
      option.value = String(index);
      option.textContent = preset.delegation;
      selectPreset.appendChild(option);
    });

    var askEdited = false;

    function syncInputs(){
      inputDelegation.value = cfg.delegation;
      inputShort.value = cfg.short;
      inputAsk.value = fill(cfg.ask);
    }

    function commitNames(){
      cfg.delegation = inputDelegation.value.trim() || '代表团';
      cfg.short = inputShort.value.trim() || cfg.delegation;
      if(!askEdited) inputAsk.value = fill(cfg.ask);
      render();
    }

    panel.hidden = false;
    syncInputs();

    inputDelegation.addEventListener('input', commitNames);
    inputShort.addEventListener('input', commitNames);
    inputAsk.addEventListener('input', function(){
      askEdited = true;
      cfg.ask = inputAsk.value;
      render();
    });

    selectPreset.addEventListener('change', function(){
      var preset = PRESETS[Number(selectPreset.value)];
      if(preset){
        cfg.delegation = preset.delegation;
        cfg.short = preset.short;
        cfg.ask = preset.ask;
        askEdited = false;
        syncInputs();
        render();
      }
      selectPreset.value = '';
    });

    /* 演示时拦截跳转，只提示目标地址 */
    document.addEventListener('click', function(e){
      var link = e.target.closest ? e.target.closest('a.x-btn, a.ghost, a.primary') : null;
      if(!link) return;
      e.preventDefault();
      var href = link.getAttribute('href') || '';
      var name = link === el.close ? '关闭' : (link === el.decline ? '暂不回应' : '进入沟通');
      toast(name + ' → ' + (href && href !== '#' ? href : '（未配置链接）'));
    });
  }

  /* ---------- 供页面/模拟器调用 ----------
     InformalCard.set({ delegation:'巴西代表团', short:'巴西', ask:'…' })
     InformalCard.set({ actions:{ accept:{ href:'negotiation.html?round=7' } } }) */
  window.InformalCard = {
    set: function(patch){ merge(cfg, patch || {}); render(); return cfg; },
    get: function(){ return clone(cfg); },
    defaults: function(){ return clone(DEFAULT); },
    reset: function(){ cfg = clone(DEFAULT); render(); return cfg; },
    fit: fitViewport
  };
})();
</script>

  <script>
    /* 与对局联动：按参数改写内容，并把三个按钮的行为交回父页面 */
    (function () {
      var q = new URLSearchParams(location.search);
      var who = q.get('party') || '';
      var round = q.get('round') || '';
      var ask = q.get('ask') || '';
      function post(action) {
        try { parent.postMessage({ type: 'secret-card', action: action }, '*'); } catch (e) {}
      }
      function patch() {
        var walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
        var n, out = [];
        while ((n = walk.nextNode())) out.push(n);
        out.forEach(function (t) {
          var v = t.nodeValue;
          if (!v) return;
          if (who && /代表团请求非正式沟通/.test(v) && v.indexOf(who + '代表团') < 0) v = v.replace(/[^\s]{1,12}代表团请求非正式沟通/, who + '代表团请求非正式沟通');
          if (round && /ROUND\s*0?\d+/i.test(v)) v = v.replace(/ROUND\s*0?\d+/i, 'ROUND ' + round);
          if (ask && /私下交换非约束性意向/.test(v)) v = ask;
          if (v !== t.nodeValue) t.nodeValue = v;
        });
        /* 去掉“某某希望就……私下交换非约束性意向”这句 */
        Array.prototype.slice.call(document.querySelectorAll('p, div')).forEach(function (el) {
          if (el.children.length === 0 && /私下交换非约束性意向/.test(el.textContent || '')) {
            el.remove();
          }
        });
        document.querySelectorAll('a[href]').forEach(function (a, i) {
          var label = (a.textContent || '').trim();
          a.addEventListener('click', function (e) {
            e.preventDefault();
            if (/进入沟通/.test(label)) post('accept');
            else if (/暂不回应/.test(label)) post('decline');
            else post('close');
          });
        });
        var x = document.querySelector('.x-btn');
        if (x) x.addEventListener('click', function (e) { e.preventDefault(); post('close'); });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(patch, 60); });
      else setTimeout(patch, 60);
      /* 卡片自身渲染可能晚于补丁，持续监听直到内容稳定 */
      var mo = new MutationObserver(function () { if (!document.__patching) { document.__patching = 1; try { patch(); } catch (e) {} document.__patching = 0; } });
      document.addEventListener('DOMContentLoaded', function () {
        mo.observe(document.body, { childList: true, subtree: true, characterData: true });
        setTimeout(function () { mo.disconnect(); }, 3000);
      });
    })();
  </script>
</body>
