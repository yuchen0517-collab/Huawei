<script>
  /* 主题引导：首屏绘制前先定主题，避免闪白/闪黑。时间窗口与页面底部主题脚本一致。 */
  window.THEME_CFG = { dayStart: 7, dayEnd: 19 };
  (function(){
    try{
      var cfg = window.THEME_CFG;
      var manual = false, saved = null;
      try{
        manual = localStorage.getItem('neg-theme-mode') === 'manual';
        if(manual) saved = localStorage.getItem('neg-theme');
      }catch(e){}
      var theme;
      if(manual){
        theme = saved === 'light' ? 'light' : 'dark';
      }else{
        var now = new Date();
        var mins = now.getHours() * 60 + now.getMinutes();
        theme = (mins >= cfg.dayStart * 60 && mins < cfg.dayEnd * 60) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
      var mt = document.querySelector('meta[name="theme-color"]');
      if(mt) mt.setAttribute('content', theme === 'light' ? '#f7efe0' : '#070402');
    }catch(e){}
  })();
</script>

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--ink);color:var(--ivory);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}

  .experience{
    position:relative;
    height:100vh;
    height:100svh;
    overflow:hidden;
    isolation:isolate;
  }

  /* ---------- 舞台底图 ---------- */
  .stage-bg{
    position:absolute; inset:0; z-index:0;
    background:var(--hero) center center / cover no-repeat;
    transform:scale(1.002);
    transition:filter .75s var(--ease),transform .75s var(--ease);
  }
  .stage-base{
    position:absolute; inset:0; z-index:1;
    background:
      radial-gradient(ellipse 70% 55% at 50% 44%,rgba(255,203,135,.05),transparent 70%),
      linear-gradient(180deg,rgba(5,3,1,.18) 0%,transparent 20%,transparent 70%,rgba(5,3,1,.35) 100%);
    pointer-events:none;
  }

  /* ---------- 三个聚光区域 ---------- */
  .spot{
    position:absolute; inset:0; z-index:2;
    opacity:0;
    pointer-events:none;
    transition:opacity .75s var(--ease);
  }
  .spot-img{
    position:absolute; inset:0;
    background:var(--hero) center center / cover no-repeat;
    filter:brightness(1.1) saturate(1.05) contrast(1.02);
  }
  .spot-duel .spot-img{
    -webkit-mask-image:radial-gradient(ellipse 15% 30% at 18% 56%,#000 32%,transparent 80%);
            mask-image:radial-gradient(ellipse 15% 30% at 18% 56%,#000 32%,transparent 80%);
  }
  .spot-multi .spot-img{
    -webkit-mask-image:radial-gradient(ellipse 15.5% 33% at 50% 54%,#000 34%,transparent 81%);
            mask-image:radial-gradient(ellipse 15.5% 33% at 50% 54%,#000 34%,transparent 81%);
  }
  .spot-observe .spot-img{
    -webkit-mask-image:radial-gradient(ellipse 12.8% 28% at 83% 60%,#000 32%,transparent 80%);
            mask-image:radial-gradient(ellipse 12.8% 28% at 83% 60%,#000 32%,transparent 80%);
  }
  .spot.is-active{opacity:.18;}
  .experience.is-hovering .spot.is-active{opacity:1;}
  .experience.is-hovering .stage-bg{
    filter:brightness(.53) saturate(.65) blur(2.4px);
    transform:scale(1.016);
  }

  /* ---------- 明暗与暗角 ---------- */
  .scrim-top{
    position:absolute; left:0; right:0; top:0; height:29%; z-index:3;
    background:linear-gradient(180deg,rgba(4,2,1,.74) 0%,rgba(4,2,1,.46) 47%,rgba(4,2,1,.12) 82%,transparent 100%);
    pointer-events:none;
  }
  .scrim-bottom{
    position:absolute; left:0; right:0; bottom:0; height:36%; z-index:3;
    background:linear-gradient(180deg,transparent 0%,rgba(5,3,1,.05) 18%,rgba(5,3,1,.28) 42%,rgba(5,3,1,.68) 68%,rgba(6,3,1,.93) 88%,#070402 100%);
    pointer-events:none;
  }
  .vignette{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    background:
      radial-gradient(ellipse 78% 74% at 50% 45%,transparent 42%,rgba(5,3,1,.32) 80%,rgba(4,2,1,.72) 100%),
      linear-gradient(90deg,rgba(4,2,1,.42),transparent 14%,transparent 86%,rgba(4,2,1,.42));
  }
  .divider{
    position:absolute; top:8%; bottom:11%; width:9%; z-index:4;
    pointer-events:none;
    background:linear-gradient(90deg,transparent 0%,rgba(5,3,1,.3) 38%,rgba(5,3,1,.44) 50%,rgba(5,3,1,.3) 62%,transparent 100%);
    filter:blur(2.5px);
  }
  .divider-a{left:28.5%;}
  .divider-b{left:62.1%;}

  /* ---------- 页首 ---------- */
  .masthead{
    position:absolute; top:clamp(18px,3.4vh,36px); left:0; right:0; z-index:6;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    pointer-events:none;
  }
  .brand{display:flex; align-items:center; gap:clamp(10px,1.1vw,16px); margin-bottom:clamp(6px,1vh,12px);}
  .brand-rule{display:block; width:clamp(24px,4vw,66px); height:1px; background:linear-gradient(90deg,transparent,rgba(201,160,97,.55));}
  .brand-rule:last-child{transform:scaleX(-1);}
  .brand-tag{
    font-family:var(--latin); font-size:clamp(8px,.7vw,11px); letter-spacing:.48em; text-indent:.48em;
    color:#c4a473; text-transform:uppercase; white-space:nowrap;
  }
  .hero-title{
    font-family:var(--serif); font-weight:700;
    font-size:clamp(38px,4.7vw,68px); line-height:1.1;
    letter-spacing:.14em; text-indent:.14em;
    background:linear-gradient(180deg,#fff6e2 0%,#f3dba9 31%,#d2a463 56%,#f0d3a0 76%,#aa7838 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.7)) drop-shadow(0 0 42px rgba(226,175,104,.24));
  }
  .hero-subtitle-en{
    margin-top:clamp(7px,1.1vh,12px);
    font-family:var(--latin); font-size:clamp(9px,.82vw,13px);
    letter-spacing:.34em; text-indent:.34em; color:#c9aa7b; text-transform:uppercase;
    text-shadow:0 2px 8px rgba(0,0,0,.8);
  }
  .hero-divider{display:flex; align-items:center; gap:10px; margin:clamp(6px,1.1vh,12px) 0;}
  .hero-divider i{display:block; width:clamp(30px,4.6vw,76px); height:1px; background:linear-gradient(90deg,transparent,rgba(201,160,97,.55));}
  .hero-divider i:last-child{transform:scaleX(-1);}
  .hero-divider b{display:block; width:5px; height:5px; border:1px solid rgba(222,184,124,.9); transform:rotate(45deg); box-shadow:0 0 10px rgba(226,180,112,.4);}
  .hero-subtitle-cn{
    font-size:clamp(11px,.95vw,14px); font-weight:400; letter-spacing:.18em; text-indent:.18em;
    color:#c1a77f; text-shadow:0 2px 10px rgba(0,0,0,.9);
  }

  /* ---------- 三种模式 ---------- */
  .modes{
    position:absolute; left:3.4%; right:3.4%; top:29%; bottom:11.5%; z-index:5;
    display:grid; grid-template-columns:1fr 1.16fr 1fr;
    align-items:end;
  }
  .mode{
    position:relative;
    display:flex; align-items:flex-end; justify-content:center;
    height:100%;
    padding:0 0 clamp(4px,.6vh,8px);
    appearance:none; border:0; background:none; color:inherit; font:inherit;
    cursor:pointer; text-align:center;
    -webkit-tap-highlight-color:transparent;
    transition:opacity .65s var(--ease),filter .65s var(--ease),transform .65s var(--ease);
  }
  .mode:focus-visible{outline:1px dashed rgba(224,187,128,.55); outline-offset:6px;}
  .mode-meta{
    display:flex; flex-direction:column; align-items:center;
    position:relative; z-index:2;
    isolation:isolate;
    transition:transform .65s var(--ease);
  }
  .mode-meta::before{
    content:""; position:absolute; inset:-28px -36px -10px;
    z-index:-1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 56%,rgba(5,3,1,.74),rgba(5,3,1,.45) 46%,transparent 74%);
    filter:blur(9px);
    transition:background .65s var(--ease);
  }
  .mode-index{display:flex; align-items:center; gap:9px; margin-bottom:7px;}
  .mode-index i{display:block; width:clamp(16px,2vw,28px); height:1px; background:linear-gradient(90deg,transparent,rgba(201,160,97,.4));}
  .mode-index i:last-child{transform:scaleX(-1);}
  .mode-index b{
    font-family:var(--latin); font-size:10px; font-weight:400; letter-spacing:.24em; text-indent:.24em;
    color:#b79563; transition:color .5s var(--ease);
  }
  .mode-title{
    font-size:clamp(19px,1.7vw,27px); font-weight:600;
    letter-spacing:.12em; text-indent:.12em; color:#eadcc0;
    text-shadow:0 2px 8px rgba(0,0,0,.95),0 0 24px rgba(0,0,0,.6);
    transition:color .5s var(--ease),text-shadow .5s var(--ease),transform .5s var(--ease);
  }
  .mode-desc{
    margin-top:6px; min-height:3.8em; font-size:clamp(11px,.85vw,13px); line-height:1.9;
    letter-spacing:.08em; color:#b39b76;
    text-shadow:0 2px 8px rgba(0,0,0,.95),0 0 18px rgba(0,0,0,.7);
    transition:color .5s var(--ease);
  }
  .mode-rule{
    display:block; width:0; height:1px; margin-top:10px;
    background:linear-gradient(90deg,transparent,rgba(226,186,122,.9),transparent);
    transition:width .65s var(--ease);
  }
  .mode.is-active .mode-meta{transform:translateY(-7px);}
  .mode.is-active .mode-meta::before{
    background:radial-gradient(ellipse at 50% 56%,rgba(201,148,83,.2),rgba(5,3,1,.6) 42%,transparent 75%);
  }
  .mode.is-active .mode-title{
    display:inline-block;
    background:linear-gradient(180deg,#fff5dd 0%,#f4d7a4 38%,#d8a964 68%,#f8e4bd 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(238,192,120,.34)) drop-shadow(0 2px 7px rgba(0,0,0,.8));
    text-shadow:none;
  }
  .mode.is-active .mode-desc{color:#d9c29b;}
  .mode.is-active .mode-rule{width:82%;}
  .mode.is-active .mode-index b{color:#f1d6a3;text-shadow:0 0 10px rgba(232,190,124,.35);}
  .mode.is-active .mode-index i{background:linear-gradient(90deg,transparent,rgba(236,199,139,.6));}

  /* 悬停聚焦 */
  .experience.is-hovering .mode:not(.is-active){
    opacity:.34;
    filter:blur(1.4px) brightness(.75);
    transform:translateY(4px);
  }
  .experience.is-hovering .mode.is-active{
    opacity:1;
    filter:none;
  }

  /* ---------- 底部 ---------- */
  .cta{
    position:absolute; left:0; right:0; bottom:clamp(14px,2.4vh,26px); z-index:6;
    display:flex; flex-direction:column; align-items:center;
    gap:clamp(8px,1.2vh,14px);
    padding-top:0;

  .cta::before{
    content:""; position:absolute; left:50%; bottom:-10px;
    width:min(560px,60vw); height:140px;

  .cta-row{display:flex; align-items:center; gap:clamp(10px,1.3vw,20px);}
  .cta-line{display:block; width:clamp(26px,6vw,108px); height:1px; background:linear-gradient(90deg,transparent,rgba(201,160,97,.38));}
  .cta-line:last-child{transform:scaleX(-1);}
  .cta-gem{display:block; width:4px; height:4px; border:1px solid rgba(221,181,118,.7); transform:rotate(45deg);}
  .start-wrap{
    position:relative; padding:1px;
    background:linear-gradient(180deg,rgba(247,222,178,.98),rgba(150,106,58,.55) 42%,rgba(90,60,30,.7) 55%,rgba(231,196,138,.92));
    clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);
    filter:drop-shadow(0 12px 30px rgba(0,0,0,.65)) drop-shadow(0 0 22px rgba(218,167,100,.1));
    transition:filter .45s var(--ease),background .45s var(--ease);
  }
  .start-btn{
    position:relative; display:block;
    padding:clamp(12px,1.8vh,18px) clamp(38px,4.3vw,60px);
    border:0; cursor:pointer;
    background:linear-gradient(180deg,#3b2413 0%,#1b0e06 48%,#271509 100%);
    color:#efdab2; font-family:var(--serif);
    font-size:clamp(14px,1.1vw,18px); font-weight:500;
    letter-spacing:.46em; text-indent:.46em; white-space:nowrap;
    clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);
    transition:background .45s var(--ease),color .45s var(--ease),transform .2s var(--ease);
  }
  .start-btn::before{
    content:""; position:absolute; inset:5px;
    border:1px solid rgba(218,181,122,.25);
    clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);
    pointer-events:none;
  }
  .start-btn::after{
    content:""; position:absolute; top:0; left:-60%; width:38%; height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,232,190,.14),transparent);
    transform:skewX(-18deg); animation:sheen 7.5s ease-in-out infinite; pointer-events:none;
  }
  .start-wrap:hover{
    background:linear-gradient(180deg,#ffe9bd,#c69556 45%,#8f6233 55%,#f2d6a4);
    filter:drop-shadow(0 14px 34px rgba(0,0,0,.7)) drop-shadow(0 0 28px rgba(229,178,108,.25));
  }
  .start-wrap:hover .start-btn{background:linear-gradient(180deg,#4a2c15,#241309 52%,#33200f);color:#fff3d8;}
  .start-btn:active{transform:translateY(1px);}
  .start-btn:focus-visible{outline:1px dashed rgba(255,232,190,.7);outline-offset:3px;}
  .footer-hint{
    font-size:clamp(11px,.85vw,13px); letter-spacing:.12em; text-indent:.12em;
    color:#bda783; text-align:center;
    text-shadow:0 2px 8px rgba(0,0,0,.95);
  }
  .footer-hint span{color:#d3b281;}

  /* 点模式直接起手：离场时轻微淡出，避免“啪”地切页 */
  .experience.is-leaving{
    opacity:0;
    transform:scale(1.012);
    transition:opacity .18s var(--ease),transform .18s var(--ease);
  }

  .toast{
    position:fixed; left:50%; bottom:clamp(100px,13vh,145px); z-index:20;
    transform:translate(-50%,10px);
    padding:10px 24px;
    border:1px solid rgba(201,160,97,.35);
    background:rgba(15,8,4,.92);
    color:#e6cfa7; font-size:12px; letter-spacing:.16em;
    opacity:0; pointer-events:none;
    transition:opacity .4s var(--ease),transform .4s var(--ease);
    backdrop-filter:blur(6px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @keyframes sheen{
    0%,55%{left:-60%;}
    78%,100%{left:135%;}
  }

  /* ---------- 适配 ---------- */
  @media (max-height:760px) and (min-width:901px){
    .hero-title{font-size:clamp(34px,6vh,54px);}

    .masthead{position:relative;top:auto;margin-bottom:8px;}
    .modes{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:100%;grid-template-columns:1fr;gap:34px;align-items:stretch;margin-top:10px;}

    .scrim-bottom{height:24%;opacity:.85;}
    .spot,.divider{display:none;}
    .experience.is-hovering .stage-bg{filter:none;transform:scale(1.002);}
    .experience.is-hovering .mode:not(.is-active){opacity:.55;filter:none;transform:none;}
    .mode-title{font-size:22px;}

  @media (max-width:520px){

    .brand-rule{width:18px;}

  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
  }
  /* ================= 主题切换按钮 ================= */
  .theme-toggle{
    position:fixed; top:clamp(16px,3.2vh,34px); right:clamp(16px,2.6vw,38px); z-index:30;
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(201,160,97,.34);
    background:rgba(18,10,5,.34);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    display:grid; place-items:center; cursor:pointer;
    transition:border-color .4s var(--ease),box-shadow .4s var(--ease),background .4s var(--ease),transform .2s var(--ease);
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none; user-select:none; touch-action:manipulation;
  }
  .theme-toggle:hover{border-color:rgba(224,187,128,.72);box-shadow:0 0 20px rgba(201,151,85,.22);}
  .theme-toggle:active{transform:scale(.94);}
  .theme-toggle:focus-visible{outline:1px dashed rgba(224,187,128,.6);outline-offset:4px;}
  .theme-toggle{color:#d9b77f;}
  .theme-toggle svg{width:18px;height:18px;position:absolute;transition:all .5s var(--ease);}
  .theme-toggle .icon-sun{
    fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
    opacity:0;transform:rotate(-90deg) scale(.5);
  }
  .theme-toggle .icon-moon{fill:currentColor;stroke:none;opacity:1;transform:rotate(0) scale(1);}
  :root[data-theme="light"] .theme-toggle{background:rgba(255,252,246,.66);border-color:rgba(160,124,63,.34);color:#a07c3f;}
  :root[data-theme="light"] .theme-toggle .icon-sun{opacity:1;transform:rotate(0) scale(1);}
  :root[data-theme="light"] .theme-toggle .icon-moon{opacity:0;transform:rotate(90deg) scale(.5);}

  /* 自动模式角标 */
  .theme-toggle::after{
    content:""; position:absolute; top:1px; right:1px;
    width:8px; height:8px; border-radius:50%;
    background:#d2ab6d; border:1.5px solid transparent;
    box-shadow:0 0 8px rgba(201,151,85,.6);
    opacity:0; transform:scale(.3);
    transition:opacity .35s var(--ease),transform .35s var(--ease);
    pointer-events:none;
  }
  .theme-toggle.is-auto::after{opacity:1;transform:scale(1);}

  /* ================= 浅色主题 ================= */
  :root[data-theme="light"]{
    --ink:#f7efe0;
    --ivory:#2a1d0c;

  :root[data-theme="light"] .cta::before{background:radial-gradient(ellipse,rgba(201,151,85,.16),transparent 70%);}

</style>

<body>

<div class="experience" id="experience" data-active="multi">

  <div class="stage-bg" aria-hidden="true"></div>
  <div class="stage-base" aria-hidden="true"></div>

  <div class="spot spot-duel" aria-hidden="true"><div class="spot-img"></div></div>
  <div class="spot spot-multi" aria-hidden="true"><div class="spot-img"></div></div>
  <div class="spot spot-observe" aria-hidden="true"><div class="spot-img"></div></div>

  <div class="scrim-top" aria-hidden="true"></div>
  <div class="scrim-bottom" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="divider divider-a" aria-hidden="true"></div>
  <div class="divider divider-b" aria-hidden="true"></div>

  <header class="masthead">
    <div class="brand">
      <span class="brand-rule"></span>
      <span class="brand-tag">DIPLOMACY SIMULATOR</span>
      <span class="brand-rule"></span>
    </div>
    <h1 class="hero-title">外交谈判模拟器</h1>
    <div class="hero-divider"><i></i><b></b><i></i></div>
    <p class="hero-subtitle-cn">多边谈判实战演练</p>
  </header>

  <main class="modes" id="modes" aria-label="选择谈判模式">
    <button class="mode" data-mode="duel" type="button" aria-pressed="false" aria-label="选择双边谈判">
      <span class="mode-meta">
        <span class="mode-index"><i></i><b>I</b><i></i></span>
        <span class="mode-title">双边谈判</span>
        <span class="mode-desc">一对一交锋<br>聚焦单议题深度博弈</span>
        <span class="mode-rule"></span>
      </span>
    </button>

    <button class="mode is-active" data-mode="multi" type="button" aria-pressed="true" aria-label="选择多边谈判">
      <span class="mode-meta">
        <span class="mode-index"><i></i><b>II</b><i></i></span>
        <span class="mode-title">多边谈判</span>
        <span class="mode-desc">体验真实多边外交现场</span>
        <span class="mode-rule"></span>
      </span>

      <span class="cta-line"></span>

</div>

<button class="theme-toggle" id="themeToggle" type="button" onclick="toggleTheme(event)"
        aria-label="切换主题" title="单击切换亮暗，长按恢复跟随系统时间">
  <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V2m0 20v-2M4 12H2m20 0h-2M5.6 5.6L4.2 4.2m15.6 15.6l-1.4-1.4M5.6 18.4L4.2 19.8m15.6-15.6l-1.4 1.4M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"></path></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
</button>

<script>
  (function(){
    var exp = document.getElementById('experience');
    var wrap = document.getElementById('modes');
    var modes = Array.prototype.slice.call(document.querySelectorAll('.mode'));
    var spots = {
      duel: document.querySelector('.spot-duel'),
      multi: document.querySelector('.spot-multi'),
      observe: document.querySelector('.spot-observe')
    };
    var toast = document.getElementById('toast');
    var toastTimer = null;

    /* 三种模式各自进入对应的起手式页面（与合并版一致：点模式 = 直接进场） */
    var MODE_PAGES = {
      duel:    'select/start.html',
      multi:   'select/start-1vn.html',
      observe: 'select/start-watch.html'
    };
    var leaving = false;

    function openPage(key){
      var url = MODE_PAGES[key];
      if(!url || leaving) return;
      leaving = true;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduce){ location.href = url; return; }
      exp.classList.add('is-leaving');
      setTimeout(function(){ location.href = url; }, 180);
    }

    // 从起手式 / 谈判页返回（含 bfcache）时，清掉离场状态
    window.addEventListener('pageshow', function(){
      leaving = false;
      exp.classList.remove('is-leaving');
    });

    function select(mode){
      var key = mode.getAttribute('data-mode');
      modes.forEach(function(m){
        var on = m === mode;
        m.classList.toggle('is-active', on);
        m.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      Object.keys(spots).forEach(function(k){
        spots[k].classList.toggle('is-active', k === key);
      });
      exp.setAttribute('data-active', key);
    }

    modes.forEach(function(mode){
      mode.addEventListener('pointerenter', function(){
        exp.classList.add('is-hovering');
        select(mode);
      });
      mode.addEventListener('focus', function(){
        exp.classList.add('is-hovering');
        select(mode);
      });
      mode.addEventListener('click', function(){
        select(mode);
        openPage(mode.getAttribute('data-mode'));
      });
    });

    wrap.addEventListener('pointerleave', function(){
      exp.classList.remove('is-hovering');
    });
    wrap.addEventListener('focusout', function(e){
      if(!wrap.contains(e.relatedTarget)){
        exp.classList.remove('is-hovering');
      }
    });

    var start = document.querySelector('.start-btn');
    start.addEventListener('click', function(){
      // 学习模式：进入学习地图；学完从学习地图进入起手式
      window.location.href = 'learn/index.html';
    });
  })();
</script>
<script>
  /* ========== 主题：跟随系统时间自动 + 手动切换（与学习模式页共用偏好） ========== */
  (function(){
    'use strict';

    var CFG        = window.THEME_CFG || { dayStart: 7, dayEnd: 19 };
    var MODE_KEY   = 'neg-theme-mode';
    var THEME_KEY  = 'neg-theme';
    var META_COLOR = { dark:'#070402', light:'#f7efe0' };
    var CHECK_MS   = 30000;
    var LONG_PRESS = 600;

    var html  = document.documentElement;
    var meta  = document.querySelector('meta[name="theme-color"]');
    var btn   = document.getElementById('themeToggle');
    var toast = document.getElementById('toast');

    var mode = 'auto';
    var ticker = null, toastTimer = null, pressTimer = null, swallowClick = false;

    function read(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
    function write(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }

    function isDaytime(date){
      var mins = date.getHours() * 60 + date.getMinutes();
      return mins >= CFG.dayStart * 60 && mins < CFG.dayEnd * 60;
    }
    function themeForTime(date){ return isDaytime(date || new Date()) ? 'light' : 'dark'; }
    function currentTheme(){ return html.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
    function themeName(theme){ return theme === 'light' ? '白天 · 亮色' : '夜间 · 深色'; }

    function paint(theme){
      html.setAttribute('data-theme', theme);
      if(meta) meta.setAttribute('content', META_COLOR[theme] || META_COLOR.dark);
      if(!btn) return;
      var auto = mode === 'auto';
      btn.classList.toggle('is-auto', auto);
      btn.title = auto
        ? '主题：跟随系统时间（当前 ' + themeName(theme) + '）\n单击可手动切换，长按或 Shift+单击恢复自动'
        : '主题：手动（当前 ' + themeName(theme) + '）\n单击切换，长按或 Shift+单击恢复跟随时间';
      btn.setAttribute('aria-label', auto ? '主题跟随系统时间，单击手动切换，长按恢复自动' : '切换亮暗主题');
      btn.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
    }

    function say(message){
      if(!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2800);
    }

    function syncAuto(persist){
      if(mode !== 'auto') return;
      var theme = themeForTime();
      if(persist) write(THEME_KEY, theme);
      paint(theme);
    }
    function stopTicker(){ if(ticker){ clearInterval(ticker); ticker = null; } }
    function startTicker(){
      stopTicker();
      ticker = setInterval(function(){ if(mode === 'auto') syncAuto(false); }, CHECK_MS);
    }
    function useAuto(announce){
      mode = 'auto';
      write(MODE_KEY, 'auto');
      syncAuto(true);
      startTicker();
      if(announce) say('已恢复跟随系统时间自动切换（' + themeName(currentTheme()) + '）');
    }

    function toggleTheme(event){
      if(event && event.shiftKey){ useAuto(true); return; }
      if(swallowClick){ swallowClick = false; return; }
      var next = currentTheme() === 'light' ? 'dark' : 'light';
      var fromAuto = mode === 'auto';
      mode = 'manual';
      write(MODE_KEY, 'manual');
      write(THEME_KEY, next);
      stopTicker();
      paint(next);
      if(fromAuto) say('已切换为手动模式（' + themeName(next) + '），长按按钮可恢复跟随时间');
    }

    function onPressStart(e){
      if(e && e.button !== undefined && e.button !== 0) return;
      swallowClick = false;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(function(){
        swallowClick = true;
        useAuto(true);
        setTimeout(function(){ swallowClick = false; }, 4000);
      }, LONG_PRESS);
    }
    function onPressEnd(){ clearTimeout(pressTimer); }

    if(btn){
      btn.addEventListener('pointerdown', onPressStart);
      btn.addEventListener('pointerup', onPressEnd);
      btn.addEventListener('pointercancel', onPressEnd);
      btn.addEventListener('pointerleave', onPressEnd);
      btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    }

    if(read(MODE_KEY) === 'manual'){
      mode = 'manual';
      paint(read(THEME_KEY) === 'light' ? 'light' : 'dark');
    }else{
      useAuto(false);
    }

    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'visible') syncAuto(false);
    });
    window.addEventListener('focus', function(){ syncAuto(false); });
    window.addEventListener('storage', function(e){
      if(e.key !== MODE_KEY && e.key !== THEME_KEY) return;
      if(read(MODE_KEY) === 'manual'){
        mode = 'manual';
        stopTicker();
        paint(read(THEME_KEY) === 'light' ? 'light' : 'dark');
      }else{
        useAuto(false);
      }
    });

    window.toggleTheme = toggleTheme;
    window.ThemeControl = {
      auto: function(){ useAuto(true); },
      manual: function(theme){
        mode = 'manual';
        write(MODE_KEY, 'manual');
        var next = theme === 'light' || theme === 'dark'
          ? theme
          : (currentTheme() === 'light' ? 'dark' : 'light');
        write(THEME_KEY, next);
        stopTicker();
        paint(next);
      },
      getMode: function(){ return mode; },
      getTheme: currentTheme
    };
  })();
</script>
</body>
</html>
